- id: twe_legio_schaltung_relais
  alias: Legionellenschutz - Schaltung Relais
  description: Startet die Legionellenaufwärmung (Hauptautomation)

  triggers:
    - trigger: time_pattern
      minutes: "/5"

  conditions: []

  actions:
    - if:
        - condition: or
          conditions:
            # PV-Aufheizung am Tag
            - condition: and
              conditions:
                - condition: state
                  entity_id: input_boolean.twe_legionellenschutz_pv_leistung_ok
                  state: "on"
                - condition: state
                  entity_id: input_boolean.twe_legionellenschutz_ok_fallig_tag
                  state: "on"
                - condition: time
                  before: "21:00:00"

            # Legionellenschutz in der Nacht
            - condition: and
              conditions:
                - condition: state
                  entity_id: input_boolean.twe_legionellenschutz_fallig_nacht
                  state: "on"
                - condition: time
                  after: "20:59:59"
      then:
        - action: script.twe_legio_aufheizung

  mode: single
  
# PV HELFER SETZEN ------------------------------------------------------------------------------ #
- id: twe_legio_ok_pv_ueberschuss
  alias: Legionellenschutz - PV Überschuss ok
  description: Nutzt PV Überschuss für vorzeitige Aufheizung
  triggers:
    - trigger: time_pattern
      minutes: "/2"
      
  actions:
    - if:      
      - condition: numeric_state
        entity_id: sensor.leistung_netz_einspeisung
        above: 3000
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.twe_legionellenschutz_pv_leistung_ok
      else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.twe_legionellenschutz_pv_leistung_ok 
          data: {}            

  mode: single
  
  
# LADUNG FAELLIG TAG HELFER SETZEN ------------------------------------------------------------------------------ #
- id: twe_legio_ok_faellig_tag
  alias: Legionellenschutz - Tagesladung fällig
  description: Tagesladung ist fällig
  triggers:
    - trigger: time_pattern
      minutes: "/2"
      
  actions:
    - if:
      - condition: template
        value_template: >
          {% set letzte = as_timestamp( states('input_datetime.twe_legio_letzte_aufheizung'), 0) %}
          {% set tage = (as_timestamp(now()) - letzte) / 86400 %}
          {{ letzte > 0 and tage >=
             (states('input_number.twe_legio_tage_min') | float(0)) }}
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.twe_legionellenschutz_ok_fallig_tag
      else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.twe_legionellenschutz_ok_fallig_tag   
          data: {}            

  mode: single
  
  
 # LADUNG FAELLIG NACHT HELFER SETZEN ------------------------------------------------------------------------------ #
- id: twe_legio_ok_faellig_nacht
  alias: Legionellenschutz - Nachtladung fällig
  description: Nachtladung ist fällig
  triggers:
    - trigger: time_pattern
      minutes: "/2"
      
  actions:
    - if:
      - condition: template
        value_template: >
          {% set letzte = as_timestamp( states('input_datetime.twe_legio_letzte_aufheizung'), 0) %}
          {% set tage = (as_timestamp(now()) - letzte) / 86400 %}
          {{ letzte > 0 and tage >=
             (states('input_number.twe_legio_tage_max') | float(0)) }}
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.twe_legionellenschutz_fallig_nacht
      else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.twe_legionellenschutz_fallig_nacht
          data: {}            

  mode: single
  
 # LADUNG TEMP ERREICHT ------------------------------------------------------------------------------ #
- id: twe_legio_temp_erreicht
  alias: Legionellenschutz - Temperatur erreicht
  description: Nachtladung ist fällig
  triggers:
    - trigger: time_pattern
      minutes: "/2"
      
  actions:
    - if:
      - condition: template
        value_template: >
          {{ states('sensor.technik_x_change_dynamic_isttemperatur_twe')
           | float(0) >= 60 }}
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.twe_legionellenschutz_temp_erreicht
      else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.twe_legionellenschutz_temp_erreicht
          data: {}            

  mode: single  
  
# MAX SICHERHEIT 1 - Abschaltung 1x pro Tag --------------------------------------------------------------------------------------- #
- id: twe_legio_sicherheitsabschaltung
  alias: Legionellenschutz - Sicherheitsabschaltung
  description: Schaltet das Boilerrelais täglich und bei HA Start aus

  triggers:
    - trigger: time
      at: "00:30:00"

    - trigger: homeassistant
      event: start

  conditions: []

  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.303505d7f8000000000017c0000fbf7400_0

  mode: single
  
# MAX SICHERHEIT 2 - Laufzeit ----------------------------------------------------------------------------------- #
- id: twe_legio_max_laufzeit
  alias: Legionellenschutz - Maximale Relaislaufzeit
  description: Sicherheitsabschaltung nach 3 Stunden

  triggers:
    - trigger: time_pattern
      minutes: "/5"

  conditions:
    - condition: state
      entity_id: switch.303505d7f8000000000017c0000fbf7400_0
      state: "on"

    - condition: template
      value_template: >
        {{ (as_timestamp(now()) -
            as_timestamp(states.switch['303505d7f8000000000017c0000fbf7400_0'].last_changed))
            >= 10800 }}

  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.303505d7f8000000000017c0000fbf7400_0

    - action: persistent_notification.create
      data:
        title: Legionellenaufwärmung
        message: >
          Sicherheitsabschaltung!
          Das Boilerrelais war länger als 3 Stunden eingeschaltet.

  mode: single
