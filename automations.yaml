# WERKEN TAG ==================================================================================== #
- id: entfeuchter_werken_pv_betrieb
  alias: Entfeuchter Werken PV Betrieb
  description: PV-gesteuerter Betrieb mit max. Laufzeit
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: template
      value_template: >
        {{ states('sensor.leistung_netz_einspeisung') | float(0)
           > states('input_number.entfeuchter_mind_pv_uberschuss') | float(0) }}
    - trigger: state
      entity_id: input_number.entfeuchter_werken_max_laufzeit_tag
    - trigger: state
      entity_id: switch.entfeuchter_werken_bedarf_entfeuchtung
      to: 'on'
  conditions:    
    - condition: template
      value_template: >
        {{ states('sensor.leistung_netz_einspeisung') | float(0)
           >= states('input_number.entfeuchter_mind_pv_uberschuss') | float(0) }}
    - condition: template
      value_template: >
        {{ states('sensor.entfeuchter_werken_laufzeit_heute') | float(0)
           < states('input_number.entfeuchter_werken_max_laufzeit_tag') | float(0) }}
    - condition: state
      entity_id: switch.entfeuchter_werken_bedarf_entfeuchtung
      state: 'on'
    - condition: time
      before: '21:00:00'
  actions:           
    - action: switch.turn_on
      target:
        entity_id: switch.302ed89f43f00000000029c00011044600_0
        
    # Timer nur starten, wenn er nicht bereits läuft
    - if:
        - condition: template
          value_template: >
            {{ not is_state('timer.entfeuchter_werken_ausschaltverzogerung', 'active') }}
      then:
        - action: timer.start
          target:
            entity_id: timer.entfeuchter_werken_ausschaltverzogerung          
    - wait_template: >
        {{
         (
          states('sensor.entfeuchter_werken_laufzeit_heute') | float(0)
            >= states('input_number.entfeuchter_werken_max_laufzeit_tag') | float(0)
          or states('sensor.leistung_netz_einspeisung') | float(0)
            <= states('input_number.entfeuchter_mind_pv_uberschuss') | float(0)
          or is_state('switch.entfeuchter_werken_bedarf_entfeuchtung', 'off')
          or now().hour >= 21
          )
           and is_state('timer.entfeuchter_werken_ausschaltverzogerung', 'idle') 
        }}
    - action: switch.turn_off
      target:
        entity_id: switch.302ed89f43f00000000029c00011044600_0
  mode: single
  
# WERKEN NACHT --------------------------------------------------------------------------------------- #
- id: entfeuchter_werken_nacht_betrieb
  alias: Entfeuchter Werken Nachtbetrieb
  description: Nacht Betrieb mit max. Laufzeit
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: input_number.entfeuchter_werken_max_laufzeit_nacht
    - trigger: state
      entity_id: switch.entfeuchter_werken_bedarf_entfeuchtung
      to: 'on'
  conditions:
    - condition: template
      value_template: >
        {{ states('sensor.entfeuchter_werken_laufzeit_heute') | float(0)
           < states('input_number.entfeuchter_werken_max_laufzeit_nacht') | float(0) }}
    - condition: state
      entity_id: switch.entfeuchter_werken_bedarf_entfeuchtung
      state: 'on'
    - condition: time
      after: '21:00:00'
  actions:           
    - action: switch.turn_on
      target:
        entity_id: switch.302ed89f43f00000000029c00011044600_0    
    - wait_template: >
        {{
            states('sensor.entfeuchter_werken_laufzeit_heute') | float(0)
            >= states('input_number.entfeuchter_werken_max_laufzeit_nacht') | float(0)
            or is_state('switch.entfeuchter_werken_bedarf_entfeuchtung', 'off')
            or now().strftime('%H:%M') >= '23:50'          
        }}
    - action: switch.turn_off
      data: {}
      target:
        entity_id: switch.302ed89f43f00000000029c00011044600_0
  mode: single
  
